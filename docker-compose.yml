version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: terminalhotel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terminalhotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-th_secret}
      POSTGRES_DB: ${POSTGRES_DB:-terminalhotel}
    ports:
      - '5436:5432'
    volumes:
      - terminalhotel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-terminalhotel}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: terminalhotel-redis
    restart: unless-stopped
    ports:
      - '6381:6379'
    volumes:
      - terminalhotel_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  terminalhotel_pgdata:
  terminalhotel_redisdata:
